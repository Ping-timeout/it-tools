name: Sync IT-Tools Release

on:
  workflow_dispatch:   # Manual trigger

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all branches

      - name: Get Latest Release Info
        id: it-tools
        run: |
          # Fetch the latest release tag
          LATEST_TAG=$(curl -s https://api.github.com/repos/sharevb/it-tools/releases/latest | jq -r .tag_name)
          # Prepare the clean version for the filename (remove 'v')
          CLEAN_TAG=$(echo "$LATEST_TAG" | sed 's/^v//')
          
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/sharevb/it-tools/releases/download/$LATEST_TAG/it-tools-$CLEAN_TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          # Compare against version.txt on the current main branch
          if [ -f version.txt ] && [ "$(cat version.txt)" == "${{ steps.it-tools.outputs.tag }}" ]; then
            echo "Already up to date."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Branches & Offload Large Assets
        if: steps.check.outputs.needs_update == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          # 1. Setup Identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Download and Extract to a temporary folder
          wget -O it-tools.zip "${{ steps.it-tools.outputs.url }}"
          unzip -o it-tools.zip # This creates a 'dist' folder

          # 3. Handle the DEPLOY branch
          git checkout -B deploy
          # Delete everything except .git, .github, and our new 'dist' folder
          find . -maxdepth 1 ! -name '.github' ! -name '.git' ! -name 'dist' ! -name '.' -exec rm -rf {} +
          # Move files from dist to the root
          cp -r dist/* .
          rm -rf dist it-tools.zip

          # 4. Offload files >24 MiB (e.g., ffmpeg-core-*.wasm) to R2 and rewrite JS references
          BASE_URL="${R2_PUBLIC_URL%/}"
          shopt -s nullglob
          JS_FILES=( *.js assets/*.js )

          find . -type f -size +24M -not -path './.git/*' | while IFS= read -r LARGE_FILE; do
            REL_PATH="${LARGE_FILE#./}"
            FILE_NAME=$(basename "$LARGE_FILE")
            echo "Uploading $REL_PATH to R2..."

            CONTENT_TYPE="application/octet-stream"
            if [[ "$FILE_NAME" == *.wasm ]]; then
              CONTENT_TYPE="application/wasm"
            fi

            npx --yes wrangler@latest r2 object put "$R2_BUCKET_NAME/$REL_PATH" \
              --file="$LARGE_FILE" \
              --content-type="$CONTENT_TYPE" \
              --remote

            # Rewrite relative/root-relative references in compiled JS bundles to the R2 URL
            if [ ${#JS_FILES[@]} -gt 0 ]; then
              FILE_NAME="$FILE_NAME" TARGET_URL="$BASE_URL/$REL_PATH" \
                perl -pi -e 's{(?:\.?/?assets/|\./)?\Q$ENV{FILE_NAME}\E}{$ENV{TARGET_URL}}g' "${JS_FILES[@]}"
            fi

            # Remove the oversized file from the Pages deployment directory
            rm -f "$LARGE_FILE"
          done

          # 5. Force push the static files to 'deploy'
          git add .
          git commit -m "Deploy static files for ${{ steps.it-tools.outputs.tag }}"
          git push origin deploy --force

          # 6. Handle the MAIN branch (To update the tracker)
          git checkout main
          echo "${{ steps.it-tools.outputs.tag }}" > version.txt
          git add version.txt
          git commit -m "chore: update version tracker to ${{ steps.it-tools.outputs.tag }}"
          git push origin main
